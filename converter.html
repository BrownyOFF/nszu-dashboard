<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НСЗУ: Розумний Конвертер</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M30 70 L50 40 L70 55 L85 25' stroke='white' stroke-width='8' fill='none' stroke-linecap='round'/></svg>">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-bg: #eff6ff;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #f1f5f9;
            --radius-xl: 24px;
            --shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
        
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px; }
        
        .card { 
            background: white; 
            padding: 50px; 
            border-radius: var(--radius-xl); 
            box-shadow: var(--shadow); 
            width: 100%; 
            max-width: 650px; 
            text-align: center;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .logo-icon { 
            width: 64px; height: 64px; 
            background: var(--primary); 
            border-radius: 18px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; 
            margin: 0 auto 24px;
        }

        .drop-zone { 
            border: 2px dashed var(--border); 
            border-radius: 20px; 
            padding: 60px 40px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            background: #fbfcfe; 
            margin: 32px 0;
            position: relative;
        }

        .drop-zone:hover { 
            border-color: var(--primary); 
            background: var(--primary-bg);
            transform: translateY(-2px);
        }

        .btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px 32px; 
            border-radius: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            display: none; 
            width: 100%; 
            font-size: 1rem;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(99,102,241,0.2);
        }

        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99,102,241,0.3); }

        #status { margin-top: 20px; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }

        footer { padding: 32px; text-align: center; border-top: 1px solid var(--border); background: white; }
        .watermark { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
        .watermark a { color: var(--primary); text-decoration: none; transition: 0.2s; }
        .watermark a:hover { text-decoration: underline; }

        h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
        p.subtitle { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; }
    </style>
</head>
<body>

<main>
    <div class="card">
        <div style="text-align: left; margin-bottom: 24px;">
            <a href="./main.html" style="text-decoration: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                На головну
            </a>
        </div>
        <div class="logo-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <h1>НСЗУ: Розумний Конвертер</h1>
        <p class="subtitle">Перетворення звітів Excel у JSON для аналітики без втрати даних</p>
        
        <div class="drop-zone" id="drop-zone">
            <svg style="color: var(--text-muted); margin-bottom: 16px;" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
            <p id="drop-text" style="font-weight: 700; color: var(--text-main);">Перетягніть XLSX файл сюди або натисніть для вибору</p>
            <input type="file" id="fileInput" accept=".xlsx" style="display: none">
        </div>

        <div id="status"></div>
        <button id="downloadBtn" class="btn">
            Завантажити оброблений JSON
        </button>
    </div>
</main>

<footer>
    <div class="watermark">
        Розробив <a href="https://github.com/BrownyOFF" target="_blank">Тимур Галас</a>
    </div>
</footer>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('drop-zone');
    const status = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');
    let convertedData = null;
    let fileName = "";

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFile(e.target.files[0]);
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = "var(--primary)"; dropZone.style.background = "var(--primary-bg)"; };
    dropZone.ondragleave = (e) => { e.preventDefault(); dropZone.style.borderColor = "var(--border)"; dropZone.style.background = "#fbfcfe"; };
    dropZone.ondrop = (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };

    function handleFile(file) {
        if (!file) return;
        if (!file.name.endsWith('.xlsx')) {
            alert("Будь ласка, завантажте файл формату XLSX");
            return;
        }
        fileName = file.name.replace(/\.[^/.]+$/, "");
        status.textContent = "⚙️ Виконується інтелектуальна обробка листів...";
        downloadBtn.style.display = "none";

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { 
                    type: 'array',
                    cellDates: true,
                    cellNF: true,
                    cellText: false
                });
                const result = {};

                workbook.SheetNames.forEach(name => {
                    const sheet = workbook.Sheets[name];
                    result[name] = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                });

                convertedData = result;
                status.style.color = "var(--success)";
                status.textContent = `✅ Успішно! Знайдено листів: ${workbook.SheetNames.length}`;
                downloadBtn.style.display = "block";
                document.getElementById('drop-text').innerHTML = `<span style="color:var(--primary)">${file.name}</span>`;
            } catch (err) {
                status.style.color = "var(--danger)";
                status.textContent = "❌ Помилка: " + err.message;
            }
        };
        reader.readAsArrayBuffer(file);
    }

    downloadBtn.onclick = () => {
        const blob = new Blob([JSON.stringify(convertedData)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName + ".json";
        a.click();
    };
</script>

</body>
</html>
